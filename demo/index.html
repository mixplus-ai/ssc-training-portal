<meta charset="utf-8">
<title>SSC Training Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600&family=Noto+Serif+Thai:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f2242; --navy-2:#18305a; --navy-3:#244277;
  --gold:#b48a3c; --gold-2:#d4af6a; --gold-soft:#f3ead7;
  --ivory:#f7f4ee; --paper:#ffffff; --ink:#1b2333; --ink-2:#4a5468; --ink-3:#7c8597;
  --line:#e6e1d6; --line-2:#efebe3;
  --ok:#1f7a4c; --ok-soft:#e5f3ea; --warn:#a86b0c; --warn-soft:#fbf0dc; --bad:#a3262f; --bad-soft:#f9e6e7; --info:#24508f; --info-soft:#e6eef9;
  --radius:14px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(15,34,66,.06),0 8px 24px rgba(15,34,66,.06);
  --shadow-lg:0 20px 50px rgba(15,34,66,.18);
  --serif:'Noto Serif Thai',Georgia,serif; --sans:'IBM Plex Sans Thai',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--ivory);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--navy-3);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--serif);color:var(--navy);margin:0;line-height:1.35;font-weight:600}
h1{font-size:clamp(26px,4vw,38px)} h2{font-size:clamp(21px,2.6vw,26px)} h3{font-size:18px}
.muted{color:var(--ink-3)} .small{font-size:13px} .tiny{font-size:12px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.hidden{display:none!important}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(15,34,66,.97);backdrop-filter:saturate(1.4) blur(8px);color:#fff;border-bottom:1px solid rgba(212,175,106,.35)}
.topbar .wrap{display:flex;align-items:center;gap:18px;height:66px}
.brand{display:flex;align-items:center;gap:12px;color:#fff;cursor:pointer;min-width:0}
.brand-mark{width:40px;height:40px;border-radius:10px;background:linear-gradient(140deg,var(--gold-2),var(--gold));display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:var(--navy);font-size:15px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.brand-mark img{width:100%;height:100%;object-fit:contain;border-radius:10px;background:#fff}
.brand-text{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand-text b{font-family:var(--serif);font-size:16px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text span{font-size:11px;color:var(--gold-2);letter-spacing:1.6px;text-transform:uppercase}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{color:#d9dfeb;padding:8px 13px;border-radius:8px;font-size:14px;cursor:pointer;white-space:nowrap;transition:.15s}
.nav a:hover{color:#fff;background:rgba(255,255,255,.07)}
.nav a.active{color:#fff;background:rgba(212,175,106,.16);box-shadow:inset 0 -2px 0 var(--gold-2)}
.user-chip{display:flex;align-items:center;gap:10px;cursor:pointer;padding:4px 6px 4px 4px;border-radius:40px;border:1px solid rgba(255,255,255,.14);position:relative}
.user-chip:hover{background:rgba(255,255,255,.06)}
.user-chip .nm{font-size:13px;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--gold-soft);color:var(--navy);display:grid;place-items:center;font-weight:600;flex:none;overflow:hidden;font-size:14px}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:112px;height:112px;font-size:38px;font-family:var(--serif);border:4px solid #fff;box-shadow:var(--shadow)}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;color:var(--ink);border-radius:12px;box-shadow:var(--shadow-lg);min-width:220px;padding:6px;z-index:60}
.menu a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;color:var(--ink);font-size:14px}
.menu a:hover{background:var(--ivory)}
.menu hr{border:0;border-top:1px solid var(--line-2);margin:6px 0}

/* ---------- Mobile tab bar ---------- */
.tabbar{display:none}
@media (max-width:900px){
  .nav{display:none}
  .user-chip .nm{display:none}
  .topbar .wrap{gap:10px}
  .user-area{margin-left:auto}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3);padding:4px 0;cursor:pointer}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a.active{color:var(--navy)}
  .tabbar a.active svg{color:var(--gold)}
  main{padding-bottom:86px}
}
.nav-desk-user{margin-left:6px}

/* ---------- Layout ---------- */
main{min-height:calc(100vh - 66px)}
.page{padding-block:34px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:2.2px;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.eyebrow:before{content:"";width:22px;height:1px;background:var(--gold)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-b{padding:22px}
.card-h{padding:16px 22px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:12px}
.section{margin-top:44px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;gap:12px}
.divider-gold{height:1px;background:linear-gradient(90deg,transparent,var(--gold-2),transparent);margin:28px 0}

/* ---------- Buttons / form ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 18px;font-weight:500;font-size:14.5px;cursor:pointer;transition:.15s;white-space:nowrap;background:#fff;line-height:1.3}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2)}
.btn-gold{background:linear-gradient(180deg,#c49a4c,var(--gold));color:#fff;box-shadow:0 2px 8px rgba(180,138,60,.35)}
.btn-gold:hover{filter:brightness(1.05)}
.btn-ghost{border-color:var(--line);color:var(--navy)}
.btn-ghost:hover{border-color:var(--gold-2);background:var(--gold-soft)}
.btn-danger{color:var(--bad);border-color:#efd0d3}
.btn-danger:hover{background:var(--bad-soft)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn-lg{padding:13px 26px;font-size:16px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{border-color:var(--gold-2);color:var(--navy)}
.icon-btn svg{width:17px;height:17px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:500;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-3)}
.input,select.input,textarea.input{width:100%;border:1px solid #d9d4c8;border-radius:10px;padding:10px 13px;background:#fff;outline:none;transition:.15s;font-size:15px}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(180,138,60,.15)}
textarea.input{min-height:90px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row > .field{flex:1;min-width:150px}
.check{display:inline-flex;gap:8px;align-items:center;cursor:pointer;font-size:14px}
.check input{width:17px;height:17px;accent-color:var(--navy)}

/* ---------- Chips / badges ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:30px;font-size:12px;font-weight:500;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--info-soft);color:var(--info)} .chip.gold{background:var(--gold-soft);color:#8a6524}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filter{padding:7px 14px;border-radius:30px;border:1px solid var(--line);background:#fff;font-size:13.5px;cursor:pointer;color:var(--ink-2)}
.filter.active{background:var(--navy);border-color:var(--navy);color:#fff}

/* ---------- Hero / banner ---------- */
.hero{position:relative;overflow:hidden;background:var(--navy);color:#fff}
.hero-slides{position:relative;aspect-ratio:1920/700;min-height:280px;max-height:520px}

.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease}
.hero-slide.on{opacity:1}
.hero-slide img{width:100%;height:100%;object-fit:cover}
.hero-slide .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,22,44,.86) 0%,rgba(10,22,44,.55) 45%,rgba(10,22,44,.05) 80%)}
.hero-copy{position:absolute;inset:0;display:flex;align-items:center}
.hero-copy .wrap{width:100%}
.hero-copy h1{color:#fff;max-width:620px;text-shadow:0 2px 20px rgba(0,0,0,.25)}
.hero-copy p{color:#dfe5f0;max-width:520px;font-size:16px;margin:12px 0 22px}
.hero-default{background:radial-gradient(1200px 400px at 85% 0%,rgba(212,175,106,.28),transparent 60%),radial-gradient(800px 500px at 0% 100%,rgba(36,66,119,.9),transparent 70%),linear-gradient(120deg,#0b1a34,#132a52)}
.hero-default:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(90deg,transparent,black 60%)}
.hero-dots{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:3}
.hero-dots i{width:8px;height:8px;border-radius:8px;background:rgba(255,255,255,.4);cursor:pointer;transition:.3s}
.hero-dots i.on{width:26px;background:var(--gold-2)}
.month-tag{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(212,175,106,.6);color:var(--gold-2);padding:4px 12px;border-radius:30px;font-size:12px;letter-spacing:1px;margin-bottom:14px;background:rgba(15,34,66,.4)}

/* ---------- Course cards ---------- */
.course{position:relative;overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.course:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.course-top{height:118px;position:relative;padding:18px 20px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;background:var(--c,#0f2242)}
.course-top:before{content:"";position:absolute;inset:0;background:radial-gradient(260px 120px at 100% 0%,rgba(255,255,255,.22),transparent 70%),linear-gradient(160deg,transparent 50%,rgba(0,0,0,.25))}
.course-top:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--gold-2),var(--gold))}
.course-top img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
.course-code{position:relative;font-family:var(--serif);font-size:13px;letter-spacing:2px;opacity:.9}
.course-hours{position:relative;align-self:flex-start;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:2px 10px;border-radius:20px;font-size:12px}
.course-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.course-body h3{font-size:17px}
.course-body p{margin:0;color:var(--ink-2);font-size:14px}
.course-foot{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center}
.course.selectable{cursor:pointer}
.course.selected{outline:2px solid var(--gold);outline-offset:2px}
.course.selected .tick{display:grid}
.tick{display:none;position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:var(--gold-2);color:var(--navy);place-items:center;z-index:2}
.tick svg{width:16px;height:16px}

/* ---------- Session list ---------- */
.session{display:flex;gap:18px;padding:18px 20px;align-items:center;border-bottom:1px solid var(--line-2)}
.session:last-child{border-bottom:0}
.datebox{width:66px;flex:none;text-align:center;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.datebox .m{background:var(--c,var(--navy));color:#fff;font-size:11px;padding:3px 0;letter-spacing:1px}
.datebox .d{font-family:var(--serif);font-size:26px;color:var(--navy);line-height:1.25;padding-top:4px}
.datebox .w{font-size:11px;color:var(--ink-3);padding-bottom:5px}
.session-info{flex:1;min-width:0}
.session-info h3{font-size:16px;margin-bottom:3px}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13.5px;color:var(--ink-2)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta svg{width:15px;height:15px;color:var(--gold)}
.seats{width:150px;flex:none}
.bar{height:6px;background:var(--line-2);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-2));border-radius:6px}
.session-act{flex:none;display:flex;gap:8px;align-items:center}
@media (max-width:760px){
  .session{flex-wrap:wrap;gap:12px}
  .session-info{flex-basis:calc(100% - 90px)}
  .seats{width:auto;flex:1}
}
.month-label{font-family:var(--serif);color:var(--navy);font-size:17px;margin:26px 0 10px;display:flex;align-items:center;gap:12px}
.month-label:after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- Stepper ---------- */
.stepper{display:flex;gap:0;margin:0 0 26px;counter-reset:s}
.step{flex:1;display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:14px;position:relative}
.step:not(:last-child):after{content:"";flex:1;height:1px;background:var(--line);margin:0 12px}
.step b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;flex:none}
.step.on{color:var(--navy);font-weight:500}
.step.on b{background:var(--navy);color:#fff;border-color:var(--navy)}
.step.done b{background:var(--gold-2);border-color:var(--gold-2);color:var(--navy)}
@media (max-width:620px){.step span{display:none}.step.on span{display:inline}}
.confirm-box{max-width:640px;margin:0 auto}
.kv{display:grid;grid-template-columns:140px 1fr;gap:10px 16px;font-size:15px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;font-weight:500}
@media (max-width:520px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
.success{text-align:center;padding:40px 24px}
.success .seal{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#e9cf98,var(--gold));display:grid;place-items:center;color:#fff;box-shadow:0 10px 30px rgba(180,138,60,.4)}
.success .seal svg{width:40px;height:40px}

/* ---------- Training cards ---------- */
.training{overflow:hidden}
.training-head{display:flex;gap:16px;align-items:flex-start;padding:20px 22px;border-left:4px solid var(--c,var(--navy))}
.timeline{display:flex;gap:0;padding:4px 22px 18px}
.tl{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink-3);position:relative;text-align:center}
.tl:before{content:"";position:absolute;top:11px;left:-50%;right:50%;height:2px;background:var(--line)}
.tl:first-child:before{display:none}
.tl i{width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--line);z-index:1;display:grid;place-items:center}
.tl i svg{width:13px;height:13px}
.tl.done{color:var(--navy)} .tl.done i{background:var(--gold);border-color:var(--gold);color:#fff} .tl.done:before{background:var(--gold)}
.training-body{border-top:1px solid var(--line-2);padding:16px 22px;display:grid;gap:14px}
.files{display:grid;gap:8px}
.file{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px;background:#fcfbf8}
.file .ic{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--gold-soft);color:#8a6524;flex:none}
.file .ic svg{width:18px;height:18px}
.file .t{flex:1;min-width:0;white-space:normal;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.gallery a{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line-2);display:block}
.gallery img{width:100%;height:100%;object-fit:cover;transition:.3s}
.gallery a:hover img{transform:scale(1.05)}

/* ---------- Certificates ---------- */
.cert-card{overflow:hidden;display:flex;flex-direction:column}
.cert-thumb{aspect-ratio:1.414;background:linear-gradient(135deg,#f2eee6,#fbfaf7);position:relative;border-bottom:1px solid var(--line-2);display:grid;place-items:center;overflow:hidden}
.cert-thumb canvas,.cert-thumb img{width:100%;height:100%;object-fit:contain}
.cert-thumb .ph{color:var(--ink-3);font-size:13px}
.cert-meta{padding:16px 18px;display:flex;flex-direction:column;gap:4px;flex:1}
.cert-no{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:#8a6524;background:var(--gold-soft);padding:2px 8px;border-radius:6px;align-self:flex-start}
.cert-actions{padding:0 18px 18px;display:flex;gap:8px}
.cert-actions .btn{flex:1}
.cert-preview{width:100%;border-radius:8px;box-shadow:var(--shadow);background:#fff}

/* ---------- Profile ---------- */
.profile-side{text-align:center;padding:30px 22px}
.profile-side .avatar{margin:0 auto 14px}
.photo-pick{position:relative;display:inline-block}
.photo-pick label{position:absolute;right:2px;bottom:16px;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;cursor:pointer;border:3px solid #fff}
.photo-pick label svg{width:15px;height:15px}

/* ---------- Auth ---------- */
.auth{min-height:calc(100vh - 66px);display:grid;grid-template-columns:1.05fr 1fr}
.auth-art{position:relative;overflow:hidden;color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:flex-end}
.auth-art h2{color:#fff;font-size:30px;max-width:420px}
.auth-art p{color:#cfd7e6;max-width:420px}
.auth-art .seal-row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.auth-form{display:flex;align-items:center;justify-content:center;padding:40px 20px}
.auth-form .card{width:100%;max-width:470px}
.tabs{display:flex;border-bottom:1px solid var(--line-2)}
.tabs a{flex:1;text-align:center;padding:15px;cursor:pointer;color:var(--ink-3);font-weight:500;border-bottom:2px solid transparent}
.tabs a.active{color:var(--navy);border-color:var(--gold)}
@media (max-width:860px){.auth{grid-template-columns:1fr}.auth-art{padding:32px 24px;min-height:200px}.auth-art h2{font-size:23px}}

/* ---------- Verify ---------- */
.verify-card{max-width:620px;margin:0 auto;text-align:center}
.verify-ok{border-top:4px solid var(--ok)}
.verify-bad{border-top:4px solid var(--bad)}

/* ---------- Admin ---------- */
.admin{display:grid;grid-template-columns:232px minmax(0,1fr);gap:26px;padding-block:28px 60px}
.side{position:sticky;top:86px;align-self:start}
.side a{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:10px;color:var(--ink-2);cursor:pointer;font-size:14.5px;margin-bottom:2px}
.side a svg{width:18px;height:18px;color:var(--ink-3)}
.side a:hover{background:#fff}
.side a.active{background:var(--navy);color:#fff}
.side a.active svg{color:var(--gold-2)}
.side .lbl{font-size:11px;letter-spacing:1.8px;color:var(--ink-3);text-transform:uppercase;padding:6px 14px;margin-top:8px}
@media (max-width:900px){

function drawQR(ctx, text, x, y, size, color) {
  if (!window.qrcode) return false;
  const qr = window.qrcode(0, 'M'); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), quiet = 2, cell = size / (n + quiet * 2);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y, size, size);
  ctx.fillStyle = color || '#111111';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c))
    ctx.fillRect(Math.floor(x + (c + quiet) * cell), Math.floor(y + (r + quiet) * cell), Math.ceil(cell), Math.ceil(cell));
  return true;
}
function qrCanvas(text, px, color) {
  const c = document.createElement('canvas'); c.width = c.height = px || 320;
  drawQR(c.getContext('2d'), text, 0, 0, c.width, color);
  return c;
}

function calState(key, events) {
  if (!S.cal[key]) {
    const t = new Date(), up = events.map(e => e.date).filter(d => d >= todayStr()).sort()[0];

}
function eventDays(e) {

  return out;
}
function calendarHtml(key, events, opt) {

  const today = todayStr(), cells = [];

function bookBtn(s) {

  if (s.myStatus) return `<span class="chip ok">${icS('check', 13)} ลงทะเบียนแล้ว</span>`;
  if (s.status !== 'open') return sessionChip(s.status);
  if (s.seatsLeft === 0) return `<span class="chip bad">เต็มแล้ว</span>`;
  return `<button class="btn btn-primary btn-sm" data-go="book" data-p='${JSON.stringify({ courseId: s.courseId, sessionId: s.id })}'>จองที่นั่ง</button>`;
}
function sessionDetailCard(s) {
  return `<div class="card sdetail" style="--c:${esc(s.courseColor || '#0f2242')}">
    <div class="sd-top">${dateBox(s)}<div style="flex:1;min-width:0">
      <div class="tiny" style="color:${esc(s.courseColor)};font-weight:600;letter-spacing:1px">${esc(s.courseCode || '')}${s.title ? ' · ' + esc(s.title) : ''}</div>
      <h3>${esc(s.courseTitle || '')}</h3>
      <div class="meta"><span>${ic('cal')}${thDateRange(s.date, s.endDate)}</span><span>${ic('clock')}${esc(s.startTime || '-')}–${esc(s.endTime || '-')} น.</span>
        <span>${ic('pin')}${esc(s.location || '-')}${s.mapUrl ? ` · <a href="${esc(s.mapUrl)}" target="_blank" rel="noopener">แผนที่</a>` : ''}</span></div>
      <div class="meta" style="margin-top:4px"><span>${ic('receipt')}${feeText(s)}</span><span>${ic('coin')}${esc(s.hours || '-')} ชม. · รับ ${Math.round(Number(s.hours || 0) * Number(S.settings.POINTS_PER_HOUR || 1))} แต้ม</span></div>
    </div></div>
    <div class="sd-foot"><div class="seats">${seatsHtml(s)}</div>
      <div class="row" style="gap:8px;justify-content:flex-end">${lineBtn(s.courseId, '')}<button class="btn btn-ghost btn-sm" data-addcal="${esc(s.id)}" title="บันทึกลงปฏิทิน">${icS('calplus', 15)} <span class="hide-sm">บันทึกลงปฏิทิน</span></button>${bookBtn(s)}</div></div>
  </div>`;
}
function rulesStrip(rules) {
  if (!rules) return '';
  if (rules.banned) return `<div class="rules bad">${ic('alert')}<div><b>ระงับสิทธิ์การลงทะเบียนถึงวันที่ ${thDate(rules.bannedUntil, true)}</b><div class="small">เนื่องจากเลื่อน/ยกเลิก/ไม่มาอบรมเกิน ${rules.strikeLimit} ครั้ง ท่านลงทะเบียนได้อีกครั้งตั้งแต่วันดังกล่าว</div></div></div>`;
  const warn = rules.strikes >= rules.strikeLimit;
  return `<div class="rules ${warn ? 'warn' : ''}">${ic(warn ? 'alert' : 'shield')}<div class="rules-items">
    <span>จองล่วงหน้า <b>${rules.active}/${rules.maxActive}</b> รอบ</span>
    <span>เลื่อน/ยกเลิกได้ถึง <b>${rules.changeDays} วัน</b> ก่อนวันอบรม</span>
    <span>เลื่อน/ยกเลิก/ไม่มา แล้ว <b>${rules.strikes}/${rules.strikeLimit}</b> ครั้ง${warn ? ' · ครั้งถัดไปจะถูกระงับสิทธิ์' : ''}</span></div></div>`;
}
function bindCommon(el, sessions) {
  $$('[data-addcal]', el).forEach(b => b.onclick = () => { const s = sessions.find(x => x.id === b.dataset.addcal); if (s) addToCalendar(s); });
}

};

function onAuthed(d, msg) {
  S.token = d.token; S.user = d.user; LS.set('tp_token', d.token); toast(msg);

  a ? go(a.route, a.params) : go(d.user.role === 'admin' ? 'admin' : 'home');
}

// ====================== PAYMENT FORM (fees · VAT · WHT · slip) ======================
function calcFees(s, billing, wht) {
  const fees = Array.isArray(s.fees) ? s.fees : [];
  const subtotal = Number(s.price || 0) + fees.reduce((a, f) => a + Number(f.amount || 0), 0);
  const r2 = n => Math.round(n * 100) / 100;
  const noVat = billing && billing.billingType !== 'company' && billing.noVat && isTrue(S.settings.PERSON_NO_VAT);
  const vat = isTrue(s.vat) && !noVat ? r2(subtotal * Number(S.settings.VAT_RATE || 7) / 100) : 0;
  const w = (wht && isTrue(s.whtAllowed) && billing && billing.billingType === 'company') ? r2(subtotal * Number(S.settings.WHT_RATE || 3) / 100) : 0;
  return { subtotal, vat, wht: w, total: r2(subtotal + vat - w) };
}
function feeTable(s, m) {
  const fees = Array.isArray(s.fees) ? s.fees : [];
  return `<table class="fee-tbl"><tbody>
    ${Number(s.price) ? `<tr><td>ค่าอบรม</td><td>${money(s.price)}</td></tr>` : ''}
    ${fees.map(f => `<tr><td>${esc(f.name)}</td><td>${money(f.amount)}</td></tr>`).join('')}
    ${m.vat ? `<tr><td>ภาษีมูลค่าเพิ่ม ${esc(S.settings.VAT_RATE || 7)}%</td><td>${money(m.vat)}</td></tr>` : ''}
    ${m.wht ? `<tr><td>หัก ณ ที่จ่าย ${esc(S.settings.WHT_RATE || 3)}%</td><td>−${money(m.wht)}</td></tr>` : ''}
    <tr class="tot"><td>ยอดชำระ</td><td>${money(m.total)} บาท</td></tr></tbody></table>`;
}

    <div id="feeT">${feeTable(s, calcFees(s, { billingType: bt }, false))}</div>
    <fieldset class="fs"><legend>ข้อมูลออกใบเสร็จ / ใบกำกับภาษี</legend>

        <div class="field co-only" style="max-width:180px"><label>สาขา</label><input class="input" name="branch" value="${esc(u.branch || '')}" placeholder="สำนักงานใหญ่"></div></div>

    const r = await run('registerSession', Object.assign({ sessionId: sess.id }, S.book.survey, pay));
    S.book = { done: true, doneSession: sess, doneReg: r }; await refreshMe(); VIEWS.book(el); S.book = {};

const TPL_IMG = {};
function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('โหลดรูปเทมเพลตไม่สำเร็จ')); i.src = src; });
}
async function templateImg(tplId) {
  if (TPL_IMG[tplId]) return TPL_IMG[tplId];
  const src = await call('templateImage', { templateId: tplId });
  return (TPL_IMG[tplId] = await loadImg(src));
}
async function ensureFonts(cfg) {
  if (!document.fonts) return;
  const f = Object.values((cfg && cfg.fields) || {}).filter(x => x.show !== false && x.font);
  await Promise.all(f.map(x => document.fonts.load(`${x.weight || 400} 40px "${x.font || 'Kanit'}"`, 'กขabc123').catch(() => { })));
}
function certValues(data, cfg) {
  const lang = cfg.dateLang || 'en';
  return { name: data.name, nameEn: data.nameEn || '', certNo: data.certNo, date: certDate(data.date, lang), course: data.course || '', expires: data.expires ? certDate(data.expires, lang) : '' };
}
function drawCert(canvas, img, cfg, data, opt) {
  opt = opt || {};
  const W = img.naturalWidth, H = img.naturalHeight, k = opt.scale || 1;
  canvas.width = Math.round(W * k); canvas.height = Math.round(H * k);
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  const vals = certValues(data, cfg);
  const mark = (x, y, w, h) => { ctx.strokeStyle = '#2b7bff'; ctx.lineWidth = Math.max(2, canvas.width / 600); ctx.setLineDash([10, 6]); ctx.strokeRect(x, y, w, h); ctx.setLineDash([]); };
  Object.entries(cfg.fields || {}).forEach(([key, f]) => {
    if (f.show === false) return;
    if (key === 'qr') {
      const size = f.size * canvas.height, x = f.x * canvas.width - size / 2, y = f.y * canvas.height - size / 2;
      if (data.verifyUrl) drawQR(ctx, data.verifyUrl, x, y, size, f.color);
      if (opt.highlight === key) mark(x - 6, y - 6, size + 12, size + 12);
      return;
    }
    const raw = vals[key] || ''; if (!raw) return;
    const text = (f.prefix || '') + raw;
    let size = f.size * canvas.height;
    const font = s => `${f.weight || 400} ${s}px "${f.font || 'Kanit'}", "IBM Plex Sans Thai", sans-serif`;
    ctx.font = font(size);
    const maxW = (f.maxWidth || 0.9) * canvas.width;
    while (ctx.measureText(text).width > maxW && size > 8) { size -= 1; ctx.font = font(size); }
    ctx.fillStyle = f.color || '#000'; ctx.textAlign = f.align || 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, f.x * canvas.width, f.y * canvas.height);
    if (opt.highlight === key) {
      const w = ctx.measureText(text).width, x0 = f.align === 'left' ? f.x * canvas.width : f.align === 'right' ? f.x * canvas.width - w : f.x * canvas.width - w / 2;
      mark(x0 - 10, f.y * canvas.height - size * 0.75, w + 20, size * 1.5);
    }
  });
}
async function renderCertCanvas(data, scale) {
  const img = await templateImg(data.template.id);
  await ensureFonts(data.template.config);
  const c = document.createElement('canvas');
  drawCert(c, img, data.template.config, data, { scale: scale || 1 });
  return c;
}
async function certPdf(data) {
  const c = await renderCertCanvas(data, 1);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4', compress: true });
  pdf.setProperties({ title: 'Certificate ' + data.certNo, subject: data.course, author: S.settings.ORG_NAME || '' });
  pdf.addImage(c.toDataURL('image/jpeg', 0.93), 'JPEG', 0, 0, 297, 210);
  pdf.save(`Certificate_${data.certNo}.pdf`);
}
async function certPng(data) {
  const c = await renderCertCanvas(data, 1);
  downloadBlob(c.toDataURL('image/png'), `Certificate_${data.certNo}.png`);
}
async function openCert(regId) {
  const data = await run('getCertificate', { regId });

async function templateEditor(t, host) {
  const cfg = t.config && t.config.fields ? t.config : DEFAULT_CFG();
  Object.keys(DEFAULT_CFG().fields).forEach(k => { if (!cfg.fields[k]) cfg.fields[k] = DEFAULT_CFG().fields[k]; });

      <div class="field"><label>รูปแบบวันที่</label><select class="input" id="dl"><option value="en" ${cfg.dateLang !== 'th' ? 'selected' : ''}>English (2 November 2026)</option><option value="th" ${cfg.dateLang === 'th' ? 'selected' : ''}>ไทย (2 พฤศจิกายน 2569)</option></select></div>
      <div class="field-tabs">${Object.keys(FIELD_LABEL).map(k => `<a class="filter ${k === sel ? 'active' : ''}" data-fk="${k}">${FIELD_LABEL[k]}</a>`).join('')}</div>
      <div id="fc"></div></div></div>`,
    `<button class="btn btn-ghost" data-x>ยกเลิก</button><button class="btn btn-primary" id="ok">${ic('check')} บันทึกเทมเพลต</button>`, { wide: true });
  const cv = $('#tc', m.el);
  const draw = async () => { if (!img) { cv.classList.add('hidden'); return; } cv.classList.remove('hidden'); await ensureFonts(cfg); drawCert(cv, img, cfg, sampleData(), { scale: Math.min(1, 1400 / img.naturalWidth), highlight: sel }); };
  const ctrls = () => {
    const f = cfg.fields[sel], isQr = sel === 'qr';
    $('#fc', m.el).innerHTML = `<label class="check" style="margin-bottom:12px"><input type="checkbox" data-k="show" ${f.show !== false ? 'checked' : ''}> แสดงบนใบประกาศ</label>
      <div class="mini"><div class="field"><label>ตำแหน่ง X (%)</label><input class="input" type="number" step="0.1" data-k="x" value="${(f.x * 100).toFixed(1)}"></div>
      <div class="field"><label>ตำแหน่ง Y (%)</label><input class="input" type="number" step="0.1" data-k="y" value="${(f.y * 100).toFixed(1)}"></div>

      <div class="field"><label>สี</label><input type="color" data-k="color" value="${esc(f.color)}"></div>
      ${isQr ? '' : `<div class="field"><label>น้ำหนัก</label><select class="input" data-k="weight">${[300, 400, 500, 600].map(w => `<option ${+f.weight === w ? 'selected' : ''}>${w}</option>`).join('')}</select></div>
      <div class="field"><label>ฟอนต์</label><select class="input" data-k="font">${['Kanit', 'Noto Serif Thai', 'IBM Plex Sans Thai'].map(w => `<option ${f.font === w ? 'selected' : ''}>${w}</option>`).join('')}</select></div>

    m.close(); reloadTab(host);

  ctrls(); draw();

  ['เลขที่ลงทะเบียน', 'เลขที่การลงทะเบียน'], ['ยอดชำระ', 'ยอดค่าอบรม'], ['ข้อมูลการชำระเงิน', 'ยอด + บัญชีโอน (แสดงเฉพาะรอบที่มีค่าใช้จ่าย)'], ['Sale', 'Sale ที่เชิญ'], ['ลิงก์เว็บ', 'ลิงก์เว็บไซต์'], ['หน่วยงาน', 'ชื่อหน่วยงาน'], ['ติดต่อ', 'ข้อมูลติดต่อ']];
const MAIL_KINDS = [['REG', 'อีเมลยืนยันการลงทะเบียน', 'ส่งทันทีเมื่อผู้อบรมกดยืนยันการลงทะเบียน พร้อมแนบไฟล์ปฏิทิน .ics'], ['REMIND', 'อีเมลแจ้งเตือนก่อนวันอบรม', 'ส่งอัตโนมัติทุกวันเวลา 08:00 น. ถึงผู้ที่อบรมในอีก N วัน พร้อมแนบไฟล์ปฏิทิน .ics']];
ADMIN.emails = async el => {
  const a = S.admin, get = k => (a.settings.find(r => r.key === k) || {}).value;
  const defs = S.mailDefaults || (S.mailDefaults = await call('emailDefaults', {}));
  const kind = S.params.mk || 'REG', meta = MAIL_KINDS.find(k => k[0] === kind);
  const cur = { subject: get('EMAIL_' + kind + '_SUBJECT') || defs['EMAIL_' + kind + '_SUBJECT'], body: get('EMAIL_' + kind + '_BODY') || defs['EMAIL_' + kind + '_BODY'] };
  const s = a.sessions.filter(x => x.date >= todayStr() && !isTrue(x.archived))[0] || a.sessions[0] || {};
  const c = a.courses.find(x => x.id === s.courseId) || a.courses[0] || {};
  const days = Math.max(1, Math.round((pd(s.date || todayStr()) - pd(todayStr())) / 864e5));
  const sv = { 'ชื่อ': 'นาย สมชาย ใจดี', 'ชื่อจริง': 'สมชาย', 'บริษัท': 'บจก. ตัวอย่าง', 'หลักสูตร': c.title || '', 'รหัสหลักสูตร': c.code || '', 'ชื่อรอบ': s.title || '',
    'วันที่': thDateRange(s.date, s.endDate), 'เวลา': `${s.startTime || '09:00'}–${s.endTime || '16:00'} น.`, 'สถานที่': s.location || '-', 'แผนที่': s.mapUrl || 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.location || ''),
    'ชั่วโมง': s.hours || 6, 'แต้ม': Math.round(Number(s.hours || 6) * Number(S.settings.POINTS_PER_HOUR || 1)), 'อีกกี่วัน': kind === 'REMIND' ? (get('REMIND_DAYS') || 5) : days, 'เลขที่ลงทะเบียน': 'R-XXXXXX',
    'ยอดชำระ': '4,280 บาท', 'ข้อมูลการชำระเงิน': `ค่าอบรมที่ต้องชำระ: **4,280 บาท**\n${get('PAY_INFO') || ''}\nกรุณาแนบหลักฐานการโอนที่เมนู “การอบรมของฉัน”`, 'Sale': 'Ms Asamaporn Photim (Nous)',
    'ลิงก์เว็บ': S.settings.APP_URL || appUrl(), 'หน่วยงาน': get('ORG_NAME') || '', 'ติดต่อ': get('CONTACT') || '' };
  el.innerHTML = head('อีเมลแจ้งเตือน', 'แก้ไขข้อความอีเมลที่ส่งถึงผู้อบรม · พิมพ์ข้อความได้อิสระ แล้วกดตัวแปรเพื่อแทรกข้อมูลของแต่ละคนอัตโนมัติ') + `
    <div class="card card-b mail-opts"><label class="check"><input type="checkbox" id="se" ${isTrue(get('SEND_EMAIL')) ? 'checked' : ''}> เปิดการส่งอีเมลอัตโนมัติ</label>
      <label class="row" style="gap:8px;align-items:center">ส่งอีเมลแจ้งเตือนก่อนวันอบรม <input class="input" type="number" min="1" max="30" id="rd" value="${esc(get('REMIND_DAYS') || 5)}" style="width:70px"> วัน</label></div>
    <div class="filters" style="margin:16px 0 12px">${MAIL_KINDS.map(k => `<a class="filter ${k[0] === kind ? 'active' : ''}" data-mk="${k[0]}">${k[1]}</a>`).join('')}</div>
    <div class="mail-grid">
      <div class="card"><div class="card-h" style="display:block"><h3>${meta[1]}</h3><div class="tiny muted" style="margin-top:4px">${meta[2]}</div></div><div class="card-b">
        <div class="field"><label>หัวข้ออีเมล</label><input class="input" id="msub" value="${esc(cur.subject)}"></div>
        <div class="field"><label>เนื้อหา</label><textarea class="input mono" id="mbody" rows="18">${esc(cur.body)}</textarea>
          <span class="hint">ขึ้นบรรทัดใหม่ได้ตามปกติ · ใส่ **ข้อความ** เพื่อทำตัวหนา · ลิงก์ที่ขึ้นต้นด้วย https:// จะกดได้อัตโนมัติ</span></div>
        <div class="tiny muted" style="margin-bottom:6px">ตัวแปร (กดเพื่อแทรกที่ตำแหน่งเคอร์เซอร์)</div>
        <div class="var-chips">${MAIL_VARS.map(v => `<button type="button" class="chip var-chip" data-var="${esc(v[0])}" title="${esc(v[1])}">{${esc(v[0])}}</button>`).join('')}</div>
      </div><div class="modal-f" style="flex-wrap:wrap"><button class="btn btn-ghost btn-sm" id="mreset" style="margin-right:auto">${ic('refresh')} คืนค่าเริ่มต้น</button>
        <button class="btn btn-ghost" id="mtest">${ic('mail')} ส่งอีเมลทดสอบถึงฉัน</button><button class="btn btn-primary" id="msave">${ic('check')} บันทึก</button></div></div>
      <div class="card mail-preview"><div class="card-h"><h3>ตัวอย่างอีเมล</h3><span class="tiny muted">ใช้ข้อมูลตัวอย่าง</span></div>
        <div class="mp-head"><div><span class="muted">ถึง:</span> somchai@example.com</div><div><span class="muted">หัวข้อ:</span> <b id="psub"></b></div><div class="tiny muted">${ic('file')} แนบไฟล์ training.ics</div></div>
        <div class="mp-body" id="pbody"></div></div></div>`;
  const sub = $('#msub', el), body = $('#mbody', el);
  const prev = () => { $('#psub', el).textContent = `[${get('ORG_SHORT') || 'Training'}] ` + renderMailTpl(sub.value, sv, false); $('#pbody', el).innerHTML = renderMailTpl(body.value, sv, true); };
  sub.oninput = prev; body.oninput = prev; prev();
  let last = body;
  [sub, body].forEach(x => x.addEventListener('focus', () => { last = x; }));
  $$('[data-var]', el).forEach(b => b.onclick = () => {
    const t = '{' + b.dataset.var + '}', st = last.selectionStart ?? last.value.length, en = last.selectionEnd ?? st;
    last.value = last.value.slice(0, st) + t + last.value.slice(en); last.focus(); last.setSelectionRange(st + t.length, st + t.length); prev();
  });
  $$('[data-mk]', el).forEach(x => x.onclick = () => { S.params.mk = x.dataset.mk; ADMIN.emails(el); });
  $('#mreset', el).onclick = async () => { if (!await confirmBox('คืนค่าข้อความอีเมลนี้เป็นค่าเริ่มต้น? (ยังไม่บันทึกจนกว่าจะกด “บันทึก”)', 'คืนค่า')) return; sub.value = defs['EMAIL_' + kind + '_SUBJECT']; body.value = defs['EMAIL_' + kind + '_BODY']; prev(); };
  $('#mtest', el).onclick = async () => { const r = await run('sendTestEmail', { subject: sub.value, body: body.value }); toast('ส่งอีเมลทดสอบไปที่ ' + r.to + ' แล้ว'); };
  $('#msave', el).onclick = async () => {
    if (!sub.value.trim() || !body.value.trim()) return toast('กรุณากรอกหัวข้อและเนื้อหาอีเมล', true);
    const st = { ['EMAIL_' + kind + '_SUBJECT']: sub.value.trim(), ['EMAIL_' + kind + '_BODY']: body.value, SEND_EMAIL: $('#se', el).checked ? 'TRUE' : 'FALSE', REMIND_DAYS: String(Number($('#rd', el).value) || 5) };
    await run('saveSettings', { settings: st }, { ok: 'บันทึกข้อความอีเมลแล้ว' }); await adminLoad(true); ADMIN.emails(el);
  };
};
const EMAIL_KEYS = /^(EMAIL_|SEND_EMAIL$|REMIND_DAYS$)/;
ADMIN.settings = el => {
  const rows = S.admin.settings.filter(r => !EMAIL_KEYS.test(r.key));
  el.innerHTML = head('ตั้งค่าระบบ', 'ข้อมูลเหล่านี้เก็บในชีต Settings') + `<div class="card"><form class="card-b" id="stf"><div class="grid g2" style="gap:0 18px">
    ${rows.map(r => `<div class="field"><label>${esc(r.description || r.key)} <span class="tiny muted">(${esc(r.key)})</span></label>
      ${/_LIST$/.test(r.key) ? `<textarea class="input" name="${esc(r.key)}" rows="6">${esc(r.value)}</textarea>` : /^(TRUE|FALSE)$/i.test(String(r.value)) ? `<select class="input" name="${esc(r.key)}"><option value="TRUE" ${isTrue(r.value) ? 'selected' : ''}>เปิด (TRUE)</option><option value="FALSE" ${!isTrue(r.value) ? 'selected' : ''}>ปิด (FALSE)</option></select>` : `<input class="input" name="${esc(r.key)}" value="${esc(r.value)}">`}</div>`).join('')}</div>
    <div class="row" style="justify-content:space-between"><span class="small muted">ตัวอย่างเลขที่ใบประกาศ: <b id="ex"></b></span><button class="btn btn-primary">${ic('check')} บันทึกการตั้งค่า</button></div></form></div>`;
  const ex = () => { const v = formData($('#stf')); const y = new Date().getFullYear(); $('#ex').textContent = String(v.CERT_FORMAT || '').replace('{CODE}', 'OM').replace('{YYYY}', y).replace('{YY}', String(y).slice(2)).replace('{MM}', p2(new Date().getMonth() + 1)).replace('{RUN}', '1'.padStart(+v.CERT_RUN_DIGITS || 4, '0')); };
  $('#stf').oninput = ex; ex();
  $('#stf').onsubmit = async e => { e.preventDefault(); await run('saveSettings', { settings: formData(e.target) }, { ok: 'บันทึกการตั้งค่าแล้ว' }); await adminLoad(true); S.settings = Object.assign(S.settings, formData(e.target)); };
};

// ====================== BOOT ======================
async function boot() {
  const B = window.BOOT || {};
  const val = k => B[k] && String(B[k]).indexOf('<?') !== 0 ? String(B[k]) : '';
  try {
    if (S.token) { const d = await call('me', {}); S.user = d.user; S.settings = d.settings; }
  } catch (e) { S.token = null; LS.set('tp_token', null); }
  if (!S.settings.ORG_SHORT) { try { const d = await call('publicHome', {}); S.settings = d.settings; S.banners = d.banners; } catch (e) { } }
  if (val('verify')) return go('verify', { no: val('verify') });
  if (val('checkin')) return go('checkin', { code: val('checkin') });
  if (val('course')) return S.user ? go('book', { courseId: val('course') }) : go('schedule', { course: val('course') });
  go('home');
}
window.TP = { go, S, render, refreshMe };
boot();
})();
</script>
